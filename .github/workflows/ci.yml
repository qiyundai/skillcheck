name: Build and test
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm fixtures:recorded
      - run: node packages/cli/dist/skillcheck.mjs eval --config fixtures/semantic/recorded.config.json --dataset fixtures/semantic/examples.jsonl --output artifacts/evaluation.json
      - run: pnpm pack:cli
      - run: pnpm smoke:package
